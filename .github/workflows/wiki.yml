name: Sync Wiki

on:
    push:
        branches: [main]
        paths: ['wiki/**']
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Push wiki/ to the GitHub wiki
              run: |
                  if ! git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo; then
                      echo "::error::Could not clone the wiki repository. Enable the wiki in Settings -> Features and create an initial page once, then re-run this workflow."
                      exit 1
                  fi
                  rsync -a --delete --exclude .git wiki/ wiki-repo/
                  cd wiki-repo
                  git config user.name "github-actions[bot]"
                  git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if git diff --cached --quiet; then
                      echo "Wiki already up to date."
                      exit 0
                  fi
                  git commit -m "docs: sync wiki from ${{ github.sha }}"
                  git push
